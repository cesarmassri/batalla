<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 Batalla Naval Vibes ⚔️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .grid-container { 
      display: grid; 
      grid-template-columns: repeat(11, 1fr); 
      gap: 3px; 
      background: #0f172a; 
      padding: 3px; 
      border-radius: 12px; 
      max-width: 100%;
    }
    .cell { 
      aspect-ratio: 1 / 1;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.15rem; 
      line-height: 1;
      cursor: pointer; 
      transition: all 0.2s; 
      user-select: none;
      overflow: hidden;
      border-radius: 4px;
      font-weight: bold;
    }
    .cell.water { background: #0ea5e9; }
    .cell.ship { background: #854d0e; }
    
    /* Gota de agua con buen contraste */
    .cell.miss { 
      background: #0369a1; 
      color: #ffffff;
      text-shadow: 0 0 8px #000000, 0 0 4px #000000;
    }
    
    .cell.hit { background: #ef4444; }
    .cell.sunk { background: #7f1d1d; }

    .label { 
      background: #1e2937; 
      color: white; 
      font-weight: bold; 
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .ship-hull { display: inline-flex; gap: 2px; }
    .ship-square { 
      width: 20px; height: 20px; 
      background: #854d0e; 
      border: 1px solid #451a03; 
      border-radius: 2px;
    }
    .sunk .ship-square { 
      background: #7f1d1d; 
      position: relative; 
    }
    .sunk .ship-square::after { 
      content: "✕"; 
      position: absolute; 
      inset: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      font-size: 12px; 
      font-weight: bold;
    }

    @media (max-width: 640px) {
      .cell { font-size: 1.05rem; }
      .grid-container { gap: 2px; padding: 2px; }
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen pb-8">
  <div class="max-w-6xl mx-auto px-4">
    <h1 class="text-4xl font-bold text-center py-6 flex items-center justify-center gap-3">
      🌊 Batalla Naval <span class="text-amber-400">VIBES</span> ⚔️
    </h1>

    <div class="flex justify-center gap-4 mb-6 flex-wrap" id="top-controls">
      <button onclick="startGame()" id="ready-btn"
              class="px-8 py-3 bg-emerald-500 hover:bg-emerald-600 font-bold rounded-2xl text-lg">
        ¡Empezar Partida!
      </button>
      <button onclick="endGame()" id="restart-btn" class="hidden px-6 py-3 bg-slate-700 hover:bg-slate-600 font-bold rounded-2xl">
        Nueva Partida
      </button>
    </div>

    <div class="flex flex-col lg:flex-row gap-8">
      <div class="flex-1">
        <div class="bg-slate-900 rounded-3xl p-5 shadow-2xl">
          <h2 class="text-2xl font-bold mb-3 flex items-center gap-2"><span class="text-cyan-400">🛡️</span> Mi Tablero</h2>
          <div id="my-grid" class="grid-container mx-auto"></div>
          <p id="my-help" class="text-center mt-3 text-sm text-slate-400">Toca para poner / quitar barcos</p>
        </div>

        <div class="mt-6 bg-slate-900 rounded-3xl p-5 shadow-2xl">
          <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><span class="text-purple-400">🏴‍☠️</span> Flota enemiga (toca para tachar/destachar)</h3>
          <div id="enemy-fleet" class="flex flex-wrap gap-6 justify-center"></div>
        </div>
      </div>

      <div class="flex-1">
        <div class="bg-slate-900 rounded-3xl p-5 shadow-2xl">
          <h2 class="text-2xl font-bold mb-3 flex items-center gap-2"><span class="text-red-400">🎯</span> Tablero Enemigo</h2>
          <div id="enemy-grid" class="grid-container mx-auto"></div>
          <p class="text-center mt-3 text-sm text-slate-400">Clic = Agua → Tocado → Hundido → Vacío</p>
        </div>
      </div>
    </div>

    <div id="phase" class="text-center text-xl font-bold mt-8 text-amber-300"></div>
  </div>

  <script>
    const ROWS = 10, COLS = 10;
    const letters = 'ABCDEFGHIJ'.split('');
    
    let statusMap = Array.from({length: ROWS}, () => Array(COLS).fill('water'));
    let enemyBoard = Array.from({length: ROWS}, () => Array(COLS).fill('unknown'));
    
    let opponentShips = [
      {id:1, length:6, sunk:false, name:"Portaaviones 6"},
      {id:2, length:4, sunk:false, name:"Crucero 4"},
      {id:3, length:4, sunk:false, name:"Crucero 4"},
      {id:4, length:2, sunk:false, name:"Lancha 2"},
      {id:5, length:2, sunk:false, name:"Lancha 2"}
    ];
    
    let isPlaying = false;

    function createGrid(containerId, isMyGrid) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      container.appendChild(createLabel(''));
      for (let c = 1; c <= COLS; c++) container.appendChild(createLabel(c));
      
      for (let r = 0; r < ROWS; r++) {
        container.appendChild(createLabel(letters[r]));
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = `cell water`;
          cell.dataset.row = r;
          cell.dataset.col = c;
          if (isMyGrid) cell.addEventListener('click', handleMyCellClick);
          else cell.addEventListener('click', handleEnemyCellClick);
          container.appendChild(cell);
        }
      }
    }

    function createLabel(text) {
      const div = document.createElement('div');
      div.className = 'label';
      div.textContent = text;
      return div;
    }

    function renderMyGrid() {
      document.querySelectorAll('#my-grid .cell').forEach(cell => {
        const r = +cell.dataset.row, c = +cell.dataset.col;
        const st = statusMap[r][c];
        cell.className = `cell ${st}`;
        cell.textContent = st === 'ship' ? '🛳️' : st === 'hit' ? '🔥' : '';
      });
    }

    function renderEnemyGrid() {
      document.querySelectorAll('#enemy-grid .cell').forEach(cell => {
        const r = +cell.dataset.row, c = +cell.dataset.col;
        const st = enemyBoard[r][c];
        cell.className = `cell water`;
        cell.textContent = '';
        if (st === 'miss') { 
          cell.classList.add('miss'); 
          cell.textContent = '💧'; 
        }
        else if (st === 'hit') { 
          cell.classList.add('hit'); 
          cell.textContent = '🔥'; 
        }
        else if (st === 'sunk') { 
          cell.classList.add('sunk'); 
          cell.textContent = '💥'; 
        }
      });
    }

    function renderEnemyFleet() {
      const container = document.getElementById('enemy-fleet');
      container.innerHTML = '';
      opponentShips.forEach(ship => {
        const div = document.createElement('div');
        div.className = `flex flex-col items-center cursor-pointer transition-all ${ship.sunk ? 'sunk opacity-60' : ''}`;
        div.innerHTML = `
          <div class="ship-hull">
            ${Array(ship.length).fill('<div class="ship-square"></div>').join('')}
          </div>
          <p class="text-xs mt-1">${ship.name}</p>
        `;
        div.addEventListener('click', () => {
          ship.sunk = !ship.sunk;
          renderEnemyFleet();
        });
        container.appendChild(div);
      });
    }

    function handleMyCellClick(e) {
      const r = +e.target.dataset.row;
      const c = +e.target.dataset.col;
      
      if (!isPlaying) {
        statusMap[r][c] = statusMap[r][c] === 'water' ? 'ship' : 'water';
      } else {
        const current = statusMap[r][c];
        if (current === 'ship') statusMap[r][c] = 'hit';
        else if (current === 'hit') statusMap[r][c] = 'ship';
      }
      renderMyGrid();
    }

    function handleEnemyCellClick(e) {
      if (!isPlaying) return;
      const r = +e.target.dataset.row, c = +e.target.dataset.col;
      const states = ['unknown', 'miss', 'hit', 'sunk'];
      let idx = states.indexOf(enemyBoard[r][c]);
      enemyBoard[r][c] = states[(idx + 1) % 4];
      renderEnemyGrid();
    }

    window.startGame = () => {
      isPlaying = true;
      document.getElementById('ready-btn').classList.add('hidden');
      document.getElementById('restart-btn').classList.remove('hidden');
      document.getElementById('phase').textContent = "¡Partida en marcha! Habla con tu rival 🌊";
      document.getElementById('my-help').textContent = "Toca el barco cuando te digan 'tocado'";
      renderMyGrid();
    };

    window.endGame = () => location.reload();

    function init() {
      createGrid('my-grid', true);
      createGrid('enemy-grid', false);
      renderMyGrid();
      renderEnemyGrid();
      renderEnemyFleet();
      document.getElementById('phase').textContent = "Coloca tus barcos libremente";
    }
    window.onload = init;
  </script>
</body>
</html>
