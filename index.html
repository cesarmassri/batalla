<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 Batalla Naval Vibes ⚔️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .grid-container { 
      display: grid; 
      grid-template-columns: repeat(11, minmax(0, 1fr)); 
      gap: 2px; 
      background: #0f172a; 
      padding: 2px; 
      border-radius: 12px; 
    }
    .cell { 
      aspect-ratio: 1/1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.4rem; 
      cursor: pointer; 
      transition: all 0.2s;
      user-select: none;
    }
    .cell.water { background: #0ea5e9; }
    .cell.ship { background: #854d0e; }
    .cell.miss { background: #0ea5e9; }
    .cell.hit { background: #ef4444; }
    .cell.sunk { background: #7f1d1d; }
    .label { background: #1e2937; color: white; font-weight: bold; }
    
    .ship-hull { display: inline-flex; gap: 2px; }
    .ship-square { 
      width: 22px; height: 22px; 
      background: #854d0e; 
      border: 1px solid #451a03; 
      border-radius: 2px;
    }
    .sunk .ship-square { 
      background: #7f1d1d; 
      position: relative; 
    }
    .sunk .ship-square::after { 
      content: "✕"; 
      position: absolute; 
      inset: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      font-size: 14px; 
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen pb-12">
  <div class="max-w-6xl mx-auto px-4">
    <h1 class="text-5xl font-bold text-center py-8 flex items-center justify-center gap-3">
      🌊 Batalla Naval <span class="text-amber-400">VIBES</span> ⚔️
    </h1>

    <div class="flex flex-col lg:flex-row gap-8">
      <!-- MI TABLERO -->
      <div class="flex-1">
        <div class="bg-slate-900 rounded-3xl p-6 shadow-2xl">
          <h2 class="text-2xl font-bold mb-4 flex items-center gap-2"><span class="text-cyan-400">🛡️</span> Mi Tablero</h2>
          <div id="my-grid" class="grid-container mx-auto max-w-[440px]"></div>
        </div>
      </div>

      <!-- TABLERO ENEMIGO -->
      <div class="flex-1">
        <div class="bg-slate-900 rounded-3xl p-6 shadow-2xl">
          <h2 class="text-2xl font-bold mb-4 flex items-center gap-2"><span class="text-red-400">🎯</span> Tablero Enemigo</h2>
          <div id="enemy-grid" class="grid-container mx-auto max-w-[440px]"></div>
          <p class="text-center mt-4 text-sm text-slate-400">Clic = Agua → Tocado → Hundido → Desconocido</p>
        </div>
      </div>
    </div>

    <!-- FASE -->
    <div class="mt-8 bg-slate-900 rounded-3xl p-6 text-center">
      <div id="phase" class="text-xl font-bold mb-4">Fase: Colocando barcos 🌊</div>
      
      <div id="placement-panel">
        <div class="flex flex-wrap justify-center gap-4 mb-6" id="ship-buttons"></div>
        <div class="flex justify-center gap-4">
          <button onclick="toggleOrientation()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl font-bold flex items-center gap-2">
            <span id="orientation-text">Horizontal →</span>
          </button>
          <button onclick="resetPlacement()" class="px-6 py-3 bg-red-500/80 hover:bg-red-600 rounded-2xl font-bold">Reiniciar colocación</button>
          <button onclick="startGame()" id="ready-btn" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-bold text-xl disabled:opacity-50" disabled>¡Listo! Empezar partida</button>
        </div>
      </div>

      <div id="game-panel" class="hidden">
        <button onclick="endGame()" class="mt-4 px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-2xl text-sm">Nueva partida</button>
      </div>
    </div>

    <!-- FLOTA ENEMIGA -->
    <div class="mt-8 bg-slate-900 rounded-3xl p-6">
      <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="text-purple-400">🏴‍☠️</span> Flota enemiga (toca para tachar/des-tachar)</h3>
      <div id="enemy-fleet" class="flex flex-wrap gap-6 justify-center"></div>
    </div>
  </div>

  <script>
    const ROWS = 10, COLS = 10;
    const letters = 'ABCDEFGHIJ'.split('');
    
    let myShips = [];
    let shipMap = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    let statusMap = Array.from({length: ROWS}, () => Array(COLS).fill('water'));
    
    let enemyBoard = Array.from({length: ROWS}, () => Array(COLS).fill('unknown'));
    
    let opponentShips = [
      {id:1, length:6, sunk:false, name:"Portaaviones 6"},
      {id:2, length:4, sunk:false, name:"Crucero 4"},
      {id:3, length:4, sunk:false, name:"Crucero 4"},
      {id:4, length:2, sunk:false, name:"Lancha 2"},
      {id:5, length:2, sunk:false, name:"Lancha 2"}
    ];
    
    let currentLength = null;
    let orientation = 'h';
    let isPlaying = false;

    function createGrid(containerId, isMyGrid) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      container.appendChild(createLabel(''));
      for (let c = 1; c <= COLS; c++) container.appendChild(createLabel(c));
      
      for (let r = 0; r < ROWS; r++) {
        container.appendChild(createLabel(letters[r]));
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = `cell water`;
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          if (isMyGrid) {
            cell.addEventListener('click', handleMyCellClick);
          } else {
            cell.addEventListener('click', handleEnemyCellClick);
          }
          container.appendChild(cell);
        }
      }
    }

    function createLabel(text) {
      const div = document.createElement('div');
      div.className = 'label flex items-center justify-center text-xs';
      div.textContent = text;
      return div;
    }

    function renderMyGrid() {
      document.querySelectorAll('#my-grid .cell').forEach(cell => {
        const r = +cell.dataset.row, c = +cell.dataset.col;
        const st = statusMap[r][c];
        cell.className = `cell ${st}`;
        cell.textContent = st === 'miss' ? '💧' : (st === 'hit' ? '🔥' : (st === 'sunk' ? '💥' : (st === 'ship' ? '🛳️' : '')));
      });
    }

    function renderEnemyGrid() {
      document.querySelectorAll('#enemy-grid .cell').forEach(cell => {
        const r = +cell.dataset.row, c = +cell.dataset.col;
        const st = enemyBoard[r][c];
        cell.className = `cell water`;
        cell.textContent = '';
        
        if (st === 'miss') { cell.classList.add('miss'); cell.textContent = '💧'; }
        else if (st === 'hit') { cell.classList.add('hit'); cell.textContent = '🔥'; }
        else if (st === 'sunk') { cell.classList.add('sunk'); cell.textContent = '💥'; }
      });
    }

    function renderEnemyFleet() {
      const container = document.getElementById('enemy-fleet');
      container.innerHTML = '';
      opponentShips.forEach(ship => {
        const div = document.createElement('div');
        div.className = `flex flex-col items-center cursor-pointer transition-all ${ship.sunk ? 'sunk opacity-60' : ''}`;
        div.innerHTML = `
          <div class="ship-hull">
            ${Array(ship.length).fill('<div class="ship-square"></div>').join('')}
          </div>
          <p class="text-xs mt-1">${ship.name}</p>
        `;
        div.addEventListener('click', () => {
          ship.sunk = !ship.sunk;
          renderEnemyFleet();
        });
        container.appendChild(div);
      });
    }

    function canPlace(row, col, length, orient) {
      for (let i = 0; i < length; i++) {
        let r = orient === 'h' ? row : row + i;
        let c = orient === 'h' ? col + i : col;
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || statusMap[r][c] === 'ship') return false;
      }
      return true;
    }

    function placeShip(row, col, length) {
      if (!canPlace(row, col, length, orientation)) {
        alert("¡No cabe ahí! Prueba otra posición.");
        return false;
      }
      const shipIndex = myShips.length;
      const positions = [];
      
      for (let i = 0; i < length; i++) {
        let r = orientation === 'h' ? row : row + i;
        let c = orientation === 'h' ? col + i : col;
        statusMap[r][c] = 'ship';
        shipMap[r][c] = shipIndex;
        positions.push({row:r, col:c});
      }
      
      myShips.push({length, positions, hits:0, sunk:false});
      renderMyGrid();
      return true;
    }

    function handleMyCellClick(e) {
      if (!isPlaying) {
        if (currentLength) placeShip(+e.target.dataset.row, +e.target.dataset.col, currentLength);
      } else {
        // rival te dispara
        const r = +e.target.dataset.row, c = +e.target.dataset.col;
        if (['miss','hit','sunk'].includes(statusMap[r][c])) return;
        
        const shipIndex = shipMap[r][c];
        if (shipIndex >= 0) {
          statusMap[r][c] = 'hit';
          const ship = myShips[shipIndex];
          ship.hits++;
          if (ship.hits === ship.length) {
            ship.sunk = true;
            ship.positions.forEach(p => statusMap[p.row][p.col] = 'sunk');
            alert("¡HUNDIDO! 🔥");
          } else alert("¡Tocado!");
        } else {
          statusMap[r][c] = 'miss';
          alert("💧 Agua");
        }
        renderMyGrid();
      }
    }

    // === NUEVO: CICLO EN TABLERO ENEMIGO ===
    function handleEnemyCellClick(e) {
      if (!isPlaying) return;
      const r = +e.target.dataset.row;
      const c = +e.target.dataset.col;
      
      const states = ['unknown', 'miss', 'hit', 'sunk'];
      let current = enemyBoard[r][c];
      let nextIndex = (states.indexOf(current) + 1) % states.length;
      enemyBoard[r][c] = states[nextIndex];
      
      renderEnemyGrid();
    }

    function updateShipButtons() {
      const placed6 = myShips.filter(s => s.length === 6).length;
      const placed4 = myShips.filter(s => s.length === 4).length;
      const placed2 = myShips.filter(s => s.length === 2).length;
      
      document.getElementById('ship-buttons').innerHTML = `
        <button onclick="selectShip(6)" class="px-5 py-3 bg-amber-700 hover:bg-amber-600 rounded-2xl font-bold ${placed6 >= 1 ? 'opacity-30 pointer-events-none' : ''}">Barco 6</button>
        <button onclick="selectShip(4)" class="px-5 py-3 bg-amber-700 hover:bg-amber-600 rounded-2xl font-bold ${placed4 >= 2 ? 'opacity-30 pointer-events-none' : ''}">Barco 4</button>
        <button onclick="selectShip(2)" class="px-5 py-3 bg-amber-700 hover:bg-amber-600 rounded-2xl font-bold ${placed2 >= 2 ? 'opacity-30 pointer-events-none' : ''}">Barco 2</button>
      `;
      document.getElementById('ready-btn').disabled = myShips.length < 5;
    }

    window.selectShip = (len) => { currentLength = len; };
    window.toggleOrientation = () => {
      orientation = orientation === 'h' ? 'v' : 'h';
      document.getElementById('orientation-text').textContent = orientation === 'h' ? 'Horizontal →' : 'Vertical ↓';
    };
    window.resetPlacement = () => {
      if (confirm("¿Borrar todo y volver a colocar?")) {
        myShips = []; shipMap = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
        statusMap = Array.from({length: ROWS}, () => Array(COLS).fill('water'));
        renderMyGrid(); updateShipButtons();
      }
    };
    window.startGame = () => {
      isPlaying = true;
      document.getElementById('placement-panel').classList.add('hidden');
      document.getElementById('game-panel').classList.remove('hidden');
      document.getElementById('phase').innerHTML = `¡Partida en marcha! 🌊 Habla con tu rival`;
    };
    window.endGame = () => location.reload();

    function init() {
      createGrid('my-grid', true);
      createGrid('enemy-grid', false);
      renderMyGrid();
      renderEnemyGrid();
      renderEnemyFleet();
      updateShipButtons();
    }
    window.onload = init;
  </script>
</body>
</html>
